
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bihar Academic Battle School Login">
  <title>School Login | Bihar Academic Battle</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 28px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      color: #1e3a8a;
      font-size: 25px;
    }

    .subtitle {
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #1e3a8a;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .error {
      color: #991b1b;
      background: #fee2e2;
    }

    .success {
      color: #166534;
      background: #dcfce7;
    }

    .bottom {
      margin-top: 20px;
      text-align: center;
    }

    a {
      color: #1d4ed8;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>🎓 School Login</h1>
    <p class="subtitle">Bihar Academic Battle</p>

    <form id="loginForm">
      <label for="email">Login Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginBtn">
        🔐 Login
      </button>
    </form>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <div class="bottom">
      New school?
      <a href="./pages/school-registration.html">
        Register Here
      </a>
    </div>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      signInWithEmailAndPassword,
      signOut
    } from "firebase/auth";

    import {
      ref,
      get
    } from "firebase/database";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
      message.style.display = "block";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      loginBtn.disabled = true;
      loginBtn.textContent = "Checking account...";
      message.style.display = "none";

      let authenticated = false;

      try {
        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        authenticated = true;

        const user = credential.user;

        const snapshot = await get(
          ref(db, "schools/" + user.uid)
        );

        if (!snapshot.exists()) {
          await signOut(auth);
          authenticated = false;

          throw new Error(
            "स्कूल प्रोफाइल नहीं मिला। Registration और Firebase Database रिकॉर्ड जाँचें।"
          );
        }

        const school = snapshot.val();

        if (school.status !== "active") {
          await signOut(auth);
          authenticated = false;

          throw new Error(
            "आपका स्कूल अकाउंट अभी सक्रिय नहीं है। Administrator से संपर्क करें।"
          );
        }

        showMessage(
          "Login सफल! Dashboard खोला जा रहा है...",
          "success"
        );

        window.location.replace("./dashboard.html");

      } catch (error) {
        console.error("Login error:", error);

        const messages = {
          "auth/invalid-credential":
            "ईमेल या पासवर्ड गलत है।",
          "auth/user-not-found":
            "इस ईमेल से कोई अकाउंट नहीं मिला।",
          "auth/wrong-password":
            "पासवर्ड गलत है।",
          "auth/invalid-email":
            "कृपया सही ईमेल दर्ज करें।",
          "auth/invalid-api-key":
            "Firebase API Key जाँचें।",
          "auth/too-many-requests":
            "बहुत अधिक प्रयास हुए हैं। कुछ समय बाद दोबारा प्रयास करें।",
          "auth/network-request-failed":
            "नेटवर्क समस्या। इंटरनेट और Firebase SDK कनेक्शन जाँचें।",
          "PERMISSION_DENIED":
            "Database permission denied. Firebase Rules जाँचें।",
          "permission-denied":
            "Database permission denied. Firebase Rules जाँचें।"
        };

        showMessage(
          messages[error.code] ||
          error.message ||
          "Login असफल हुआ। कृपया दोबारा प्रयास करें।"
        );

        // Do not automatically sign out after a temporary
        // database/network error if authentication succeeded.
        if (
          authenticated &&
          error.code === "PERMISSION_DENIED"
        ) {
          console.error(
            "Authentication succeeded but database access failed."
          );
        }

      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "🔐 Login";
      }
    });
  </script>
</body>
</html>
