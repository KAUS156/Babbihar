<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration | Bihar Academic Battle</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="page"><div class="card"><span class="label">Student Registration</span><h1 style="margin:10px 0 20px">Create Your Account</h1><form class="form-grid" onsubmit="event.preventDefault();alert('Registration form connected.');"><label>Full Name *<input required></label><label>Father's Name *<input required></label><label>Mother's Name<input></label><label>Date of Birth<input type="date"></label><label>Gender<select><option>Male</option><option>Female</option><option>Other</option></select></label><label>Mobile Number *<input required type="tel"></label><label>Email<input type="email"></label><label>Class *<select required><option>Select Class</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><label>School Name *<input required></label><label>District *<input required></label><label class="full">Address<textarea rows="3"></textarea></label><label>Password *<input required type="password"></label><label>Confirm Password *<input required type="password"></label><div class="full"><button class="btn">Create Account</button></div></form></div></main></body></html>
