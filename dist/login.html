
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="description" content="Bihar Academic Battle School Login">
  <title>School Login | Bihar Academic Battle</title>

  <style>*{box-sizing:border-box}body{color:#172033;background:linear-gradient(135deg,#eff6ff,#f1f5f9,#e0e7ff);place-items:center;min-height:100vh;margin:0;padding:18px;font-family:Arial,sans-serif;display:grid}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;width:100%;max-width:440px;padding:28px;box-shadow:0 12px 40px #0f172a1a}.logo{text-align:center;margin-bottom:8px;font-size:43px}h1{text-align:center;color:#1e3a8a;margin:0;font-size:25px}.subtitle{text-align:center;color:#64748b;margin-bottom:24px;line-height:1.6}label{margin:17px 0 7px;font-size:14px;font-weight:700;display:block}input{color:#172033;background:#fff;border:1px solid #cbd5e1;border-radius:9px;width:100%;min-height:48px;padding:12px;font-size:16px;display:block}input:focus{border-color:#2563eb;outline:2px solid #bfdbfe}button{color:#fff;cursor:pointer;background:#1e3a8a;border:0;border-radius:9px;width:100%;min-height:48px;margin-top:22px;padding:12px;font-size:16px;font-weight:700}button:disabled{opacity:.65;cursor:wait}.message{overflow-wrap:anywhere;border-radius:9px;margin-top:16px;padding:12px;font-size:14px;line-height:1.6;display:none}.error{color:#991b1b;background:#fee2e2;display:block}.success{color:#166534;background:#dcfce7;display:block}.info{color:#1e40af;background:#dbeafe;display:block}.bottom{text-align:center;margin-top:22px;font-size:14px;line-height:1.8}a{color:#1d4ed8;font-weight:700;text-decoration:none}a:hover{text-decoration:underline}.footer{text-align:center;color:#94a3b8;margin-top:20px;font-size:12px}</style>
  <script type="module" crossorigin src="/assets/login-DB1s_jXR.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/firebase-BUSfOZUq.js">
</head>

<body>
  <main class="card">
    <div class="logo">🎓</div>

    <h1>School Login</h1>
    <p class="subtitle">
      BIHAR ACADEMIC BATTLE<br>
      Bihar's Academic Battle Platform
    </p>

    <form id="loginForm">
      <label for="email">Login Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="स्कूल का ईमेल दर्ज करें"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="पासवर्ड दर्ज करें"
        autocomplete="current-password"
        required
      >

      <button id="loginBtn" type="submit">
        🔐 Login
      </button>
    </form>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <div class="bottom">
      New school?
      <a href="./pages/school-registration.html">
        Register Here
      </a>
      <br>
      <a href="./index.html">← Home Page</a>
    </div>

    <div class="footer">
      © Bihar Academic Battle
    </div>
  </main>

</body>
</html>
